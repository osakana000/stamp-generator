                            <details class="accordion">
                                <summary>グラデーション</summary>
                                <label>
                                    <input type="checkbox" id="guradehyouji">

                                    <br>

                                <label>

                                <br>
                                <label>グラデーションの角度

                                </label>

                        <label>

                            <label>大きさ

                <br>

                </label>
                <label>高さ
                    <input type="number" id="canvasHeight" value="512"> px
                </label>
                <button id="applysize">反映</button>
            </label>
        </div>
        <hr>
        <div>
            <label id="gazou">画像を選択
                <input type="file" id="imgfile" accept="image/*"><button id="addImage">追加</button>
            </label>
        </div>
        <div>
            <label>文字
                <br>
                <textarea id="moji" placeholder="ここに追加したい文字を入力"></textarea>
                <button id="kakutei">追加</button>
            </label>
            <label>
                <input type="checkbox" id="verticalToggle">
                縦書き
            </label>
            <label class="selectbox">フォント
                <select id="fontfamily">
                    <option value="ZenMaru" selected>ZEN丸ゴシック</option>
                    <option value="ZenKaku">ZEN角ゴシック New</option>

</html>
<script>
    const edit = document.getElementById("edit");
    const view = document.getElementById("view");

    let editMode = true;

    edit.classList.add("active");

    edit.addEventListener('click', () => {
        editMode = true;

        tab.style.display = 'block';

        const warnings = document.querySelectorAll(".outWarning");
        warnings.forEach(el => el.style.display = "");
        main.classList.remove("exporting");

        edit.classList.add("active");
        view.classList.remove("active");
    });

    view.addEventListener('click', () => {
        editMode = false;

        tab.style.display = 'none';
        //警告UIを消す
        const warnings = document.querySelectorAll(".outWarning");
        warnings.forEach(el => el.style.display = "none");
        main.classList.add("exporting");//選択枠を消す

        view.classList.add("active");
        edit.classList.remove("active");
    });

    const bold = document.getElementById("textbold");
    const italic = document.getElementById("textitalic");
    const underline = document.getElementById("textunderline");

    bold.addEventListener("click", () => {
        if (!selectedElement) return;

        selectedElement._settings.fontWeight =
            selectedElement._settings.fontWeight === "700"
            ? "500"
            : "700";

        applyTextSettings(selectedElement);

        bold.classList.toggle("active");
    });

    italic.addEventListener("click", () => {
        if (!selectedElement) return;

        selectedElement._settings.italic =
            !selectedElement._settings.italic;

        applyTextSettings(selectedElement);

        italic.classList.toggle("active");
    });

    underline.addEventListener("click", () => {
        if (!selectedElement) return;

        selectedElement._settings.underline =
            !selectedElement._settings.underline;

        applyTextSettings(selectedElement);

        underline.classList.toggle("active");
    });

    
    const main = document.getElementById("main");
    const text = document.getElementById('text');
    const moji = document.getElementById('moji');
    const kakutei = document.getElementById('kakutei');

    //設定を記録
    //テキスト
    const defaultTextSettings = {
        fontFamily: "ZenMaru",
        fontWeight: "500",
        fontSize: 50,
        color: "#000000",
        letterSpacing: 1,
        underline: false,
        italic: false,
        strokeWidth: 0,
        strokeColor: "#000000",
        strokeEnabled: false,
        textShadowEnabled: false,
        textShadow: {//影の設定
            offsetX: 0,//横
            offsetY: 0,//縦
            blur: 0,//ぼかし
            color: "#000000"
        },
        // gradient: {
        //     enabled: false,
        //     type: "linear",   //linear | radial
        //     angle: 0,
        //     color: "#000000"
        // },
        writingMode: "horizontal", //or "vertical"
        rotation: 0,
        zIndex: 1,
        paintorder: "stroke fill"
    };
    //画像
    const defaultImageSettings = {
        scale: 1,
        x: 0,
        y: 0,
        rotation: 0,
        zIndex: 1
    };
    const defaultAnimationSettings = {
        type: "none",   //none | fadeIn | scaleIn | shake | jump |
        duration: 1,    //秒
        delay: 0,       //秒
        loop: false
    };


    //見た目の設定
    function applyTextSettings(el) {
        if (!el || !el.classList.contains("text")) return;
        if (!el || !el._settings) return;
        const s = el._settings;

        const shadowLayer = el._shadowLayer;
        const fillLayer   = el._fillLayer;
        const strokeLayer   = el._strokeLayer;

        el.style.color = s.color;

        el.style.zIndex = s.zIndex;

        //設定を同じにする
        [shadowLayer, fillLayer, strokeLayer].forEach(layer => {
            layer.style.fontFamily = s.fontFamily;
            layer.style.fontWeight = s.fontWeight;
            layer.style.fontSize = s.fontSize + "px";
            layer.style.letterSpacing = s.letterSpacing + "px";
            layer.style.whiteSpace = "pre-wrap";
        });

        [shadowLayer].forEach(layer => {
            shadowLayer.style.position = "absolute";
            layer.style.zIndex = 1;
        });

        [fillLayer].forEach(layer => {
            fillLayer.style.position = "relative";
            layer.style.zIndex = 3;
        });

        [strokeLayer].forEach(layer => {
            strokeLayer.style.position = "absolute";
            layer.style.color = "transparent";
            layer.style.textShadow = "none";
            layer.style.zIndex = 2;
        });

        fillLayer.style.fontStyle = s.italic ? "italic" : "normal";
        strokeLayer.style.fontStyle = s.italic ? "italic" : "normal";
        shadowLayer.style.fontStyle = s.italic ? "italic" : "normal";

        fillLayer.style.textDecoration =
        strokeLayer.style.textDecoration =
        shadowLayer.style.textDecoration =
            s.underline ? "underline" : "none";

        //縁取りレイヤー
        if (s.strokeEnabled) {
            strokeLayer.style.webkitTextStrokeWidth = s.strokeWidth + "px";
            strokeLayer.style.webkitTextStrokeColor = s.strokeColor;
        } else {
            strokeLayer.style.webkitTextStrokeWidth = "0px";
        }

        //影レイヤー
        if (s.textShadowEnabled) {

            const shadowParts = [];

            const offsetX = s.textShadow.offsetX;
            const offsetY = s.textShadow.offsetY;
            const blur = s.textShadow.blur;
            const color = s.textShadow.color;

            //基本の影
            shadowParts.push(
                `${offsetX}px ${offsetY}px ${blur}px ${color}`
            );

            //縁取り分の厚み
            if (s.strokeEnabled && s.strokeWidth > 0) {

                const maxRadius = s.strokeWidth * 0.45; // ← 内側だけに制限

                for (let r = 1; r <= maxRadius; r++) {

                    const step = Math.max(10, Math.round(360 / (r * 8)));

                    for (let i = 0; i < 360; i += step) {

                        const rad = i * Math.PI / 180;

                        const x = Math.cos(rad) * r + offsetX;
                        const y = Math.sin(rad) * r + offsetY;

                        shadowParts.push(
                            `${x}px ${y}px ${blur}px ${color}`
                        );
                    }
                }
            }

            shadowLayer.style.textShadow = shadowParts.join(",");

        } else {

            shadowLayer.style.textShadow = "none";

        }

        //グラデーションレイヤー
        // if (s.gradient?.enabled) {

        //     let gradient;

        //     if (s.gradient.type === "linear") {
        //         gradient =
        //             `linear-gradient(${s.gradient.angle}deg, ` +
        //             `${s.color}, ${s.gradient.color})`;
        //     } else {
        //         gradient =
        //             `radial-gradient(circle, ` +
        //             `${s.color}, ${s.gradient.color})`;
        //     }

        //     fillLayer.style.background = gradient;
        //     fillLayer.style.webkitBackgroundClip = "text";
        //     fillLayer.style.backgroundClip = "text";
        //     fillLayer.style.webkitTextFillColor = "transparent";
        //     fillLayer.style.color = "transparent";
        //     fillLayer.style.isolation = "isolate";
        //     fillLayer.style.display = "inline-block";
        //     fillLayer.style.isolation = "isolate";
        //     fillLayer.style.transform = "translateZ(0)";

        // } else {

        //     fillLayer.style.background = "none";
        //     fillLayer.style.color = s.color;
        // }

        //縦書き
        if (s.writingMode === "vertical") {
            el.classList.add("vertical");
        } else {
            el.classList.remove("vertical");
        }

        applyAnimation(el);//アニメーション
        applyTransform(el);
    }

    function applyImageSettings(el) {
        const s = el._settings;

        if (s.left) el.style.left = s.left;
        if (s.top)  el.style.top  = s.top;

        el.style.zIndex = s.zIndex ?? 1;

        applyAnimation(el);

        applyTransform(el);
    }

    function applyTransform(el) {
        const s = el._settings;

        el.style.setProperty("--scale", s.scale ?? 1);
        el.style.setProperty("--rotate", `${s.rotation}deg`);

        el.style.transform =
            `scale(var(--scale)) rotate(var(--rotate))`;
    }

    function applyAnimation(el) {
        const a = el._settings.animation;

        //一旦リセット
        el.style.animation = "none";

        if (a.type === "none") return;

        let name = "";
        if (a.type === "fadeIn")  name = "fadeIn";
        if (a.type === "scaleIn") name = "scaleIn";
        if (a.type === "shake") name = "shake";
        if (a.type === "jump")  name = "jump";

        el.style.animationFillMode = "both";

        el.style.animation =
            `${name} ${a.duration}s ease ${a.delay}s ` +
            (a.loop ? "infinite" : "1");

        getduration.innerText = a.duration + "秒";
        getdelay.innerText = a.delay + "秒";

        //回転値をCSS変数に渡す
        el.style.setProperty(
            "--rotate",
            `${el._settings.rotation}deg`
        );
    }


    //記録した設定をスライダーに反映させる
    function syncUIFromSettings(el) {
        if (!el || !el._settings) return;

        const s = el._settings;

        //文字
        if (el.classList.contains("text")) {
            fontfamily.value = s.fontFamily;
            fontweight.value = s.fontWeight;

            fontsize.value = s.fontSize;
            getsize.innerText = s.fontSize + "px";
            changesize.value = s.fontSize;

            fontcolor.value = s.color;

            huti.value = s.strokeWidth;
            huticolor.value = s.strokeColor;
            changehuti.value = s.strokeWidth;

            // gradation.value = s.gradient?.angle;
            // getgkakudo.value = s.gradient?.angle;
            // changegradation.value = s.gradient?.angle;

            // gradationcolor.value = s.gradient?.color;

            // if (guradehyouji) {
            //     guradehyouji.checked = s.gradient?.enabled ?? false;
            // }

            if (hutidorihyouji) {
                hutidorihyouji.checked = s.strokeEnabled ?? false;
            }

            if (kagehyouji) {
                kagehyouji.checked = s.textShadowEnabled ?? false;
            }

            spacing.value = s.letterSpacing;
            getspacing.innerText = s.letterSpacing + "px";
            changespacing.value = s.letterSpacing;

            kasanari.value = s.zIndex;
            kasanaridata.innerText = s.zIndex;
            changekasanari.value = s.zIndex;

            verticalToggle.checked = (s.writingMode === "vertical");

            shadowX.value = s.textShadow?.offsetX ?? 0;
            shadowY.value = s.textShadow?.offsetY ?? 0;
            shadowBlur.value = s.textShadow.blur ?? 0;
            shadowColor.value = s.textShadow.color ?? "#000000";

            changekagex.value = s.textShadow?.offsetX ?? 0;
            changekagey.value = s.textShadow?.offsetY ?? 0;
            changekageblur.value = s.textShadow?.blur ?? 0;

            getkagex.innerText = shadowX.value + "px";
            getkagey.innerText = shadowY.value + "px";
            getkageblur.innerText = shadowBlur.value + "px";

            // if (el.classList.contains("text")) {
            //     const g = s.gradient;

            //     if (g?.enabled) {
            //         gradation.value = g.angle;
            //         getgkakudo.innerText = g.angle + "°";
            //         gradationcolor.value = g.color;
            //         line.checked = g.type === "linear";
            //         circle.checked = g.type === "radial";
            //     }
            // }

            kakudo.value = s.rotation;
            getkakudo.innerText = s.rotation + "°";
        }

    const warning = document.getElementById("outWarning");

    function showWarning(direction) {
        warning.style.display = "block";

        switch (direction) {
            case "left":
                warning.style.left = "0";
                warning.style.top = "50%";
                warning.style.transform = "translate(-50%, -50%)";
                break;

            case "right":
                warning.style.left = "100%";
                warning.style.top = "50%";
                warning.style.transform = "translate(-50%, -50%)";
                break;

            case "top":
                warning.style.left = "50%";
                warning.style.top = "0";
                warning.style.transform = "translate(-50%, -50%)";
                break;

            case "bottom":
                warning.style.left = "50%";
                warning.style.top = "100%";
                warning.style.transform = "translate(-50%, -50%)";
                break;
        }
    }

    function updateOutWarning(el) {
        if (!el) {
            warning.style.display = "none";
            return;
        }

        const canvasRect = main.getBoundingClientRect();
        const elRect = el.getBoundingClientRect();

        //要素が一部でも見えていたら警告なし
        const isVisible =
            elRect.right  > canvasRect.left &&
            elRect.left   < canvasRect.right &&
            elRect.bottom > canvasRect.top &&
            elRect.top    < canvasRect.bottom;

        if (isVisible){
            warning.style.display = "none";
            return;
        }

        //要素の中心（画面座標）
        const centerX = elRect.left + elRect.width / 2;
        const centerY = elRect.top  + elRect.height / 2;

        //main座標系へ変換
        let x = centerX - canvasRect.left;
        let y = centerY - canvasRect.top;

        //警告の半径分だけ内側に寄せる
        const margin = 14;

        x = clamp(x, margin, canvasRect.width  - margin);
        y = clamp(y, margin, canvasRect.height - margin);

        warning.style.display = "block";
        warning.style.left = x + "px";
        warning.style.top  = y + "px";
    }

    //つまみの位置にツールチップを出す
    function setupSliderTooltip(rangeEl, tooltipEl, unit = "") {
        function updatePosition() {
            const min = rangeEl.min ? Number(rangeEl.min) : 0;
            const max = rangeEl.max ? Number(rangeEl.max) : 100;
            const val = Number(rangeEl.value);

            const percent = (val - min) / (max - min);

            const sliderWidth = rangeEl.offsetWidth;
            const thumbWidth = 24; // 必要なら調整
            const thumbOffset =
                percent * (sliderWidth - thumbWidth) + thumbWidth / 2;

            tooltipEl.style.left = thumbOffset + "px";
            tooltipEl.innerText = val + unit;
        }

        rangeEl.addEventListener("input", updatePosition);
        window.addEventListener("load", updatePosition);
    }

    const activeColor = "#1fc3ff";
    const inactiveColor = "#ffffff";

    //つまみ前後に色をつける
    function colorRange(rangeEl) {
        function colorratio() {
            // const ratio = (rangeEl.value - rangeEl.min) / (rangeEl.max - rangeEl.min) * 100;
            // rangeEl.style.background = `linear-gradient(90deg, ${activeColor} ${ratio}%, ${inactiveColor} ${ratio}%)`;  
            
            const min = rangeEl.min !== "" ? Number(rangeEl.min) : 0;
            const max = rangeEl.max !== "" ? Number(rangeEl.max) : 100;
            const value = Number(rangeEl.value);

            const range = max - min;

            if (range === 0) return; // 0除算防止

            const ratio = ((value - min) / range) * 100;

            rangeEl.style.background =
                `linear-gradient(90deg,
                    ${activeColor} ${ratio}%,
                    ${inactiveColor} ${ratio}%)`; 
        }

        rangeEl.addEventListener("input",colorratio);
        window.addEventListener("load", colorratio);

        return colorratio;
    }

    function syncRangeAndNumber(range, number, callback) {

            number.value = range.value;

            // range用の疑似eventを作る
            const fakeEvent = {
                target: range
            };

            callback(fakeEvent);
        });
    }

    const SNAP_DISTANCE = 10;

    function snapPosition(value, targets, axis) {
        const LOCK_DISTANCE = 15;

        //すでにスナップ中ならロックを維持
        if (snapState[axis] !== null) {
            if (Math.abs(value - snapState[axis]) > LOCK_DISTANCE) {
                snapState[axis] = null; //ロック解除
            } else {
                return { value: snapState[axis], snapped: true };
            }
        }

        //新規スナップ判定
        for (const t of targets) {
            if (Math.abs(value - t) <= SNAP_DISTANCE) {
                snapState[axis] = t;
                return { value: t, snapped: true };
            }
        }

        return { value, snapped: false };
    }

    function snapX(el, left) {
        const canvasWidth = main.clientWidth;
        const elWidth = el.offsetWidth;

        const targets = [
            0,
            (canvasWidth - elWidth) / 2,
            canvasWidth - elWidth
        ];

        return snapPosition(left, targets, "x");
    }
    function snapY(el, top) {
        const canvasHeight = main.clientHeight;
        const elHeight = el.offsetHeight;

        const targets = [
            0,
            (canvasHeight - elHeight) / 2,
            canvasHeight - elHeight
        ];

        return snapPosition(top, targets, "y");
    }

    //文字移動
    let isDragging = false;
    let offsetX = 0;
    let offsetY = 0;

    const startDrag = (e, el) => {
        if (!editMode) return;

        console.log("ドラッグ開始")
        isDragging = true;

        const canvasRect = main.getBoundingClientRect();
        const elRect = el.getBoundingClientRect();

        const scale = getScale(el);

        offsetX = (e.clientX - elRect.left) / scale;
        offsetY = (e.clientY - elRect.top)  / scale;

        document.onmousemove = (e) => {
            if (!isDragging) return;

            const scale = getScale(el);

            let left =
                e.clientX - canvasRect.left - offsetX * scale;
            let top  =
                e.clientY - canvasRect.top  - offsetY * scale;


            if (snapEnabled) {
                const sx = snapX(el, left);
                const sy = snapY(el, top);

                if (sx.snapped) left = sx.value;
                if (sy.snapped) top  = sy.value;

                el.classList.toggle(
                    "snap-active",
                    sx.snapped || sy.snapped
                );
            }

            el._settings.left = left + "px";
            el._settings.top  = top  + "px";

            applyImageSettings(el);
            syncSliderFromElement(el);
            updateOutWarning(el);
        };

        document.onmouseup = () => {
            isDragging = false;
            snapState.x = null;
            snapState.y = null;
            el.classList.remove("snap-active");
            document.onmousemove = null;
            document.onmouseup = null;
        };
    };


    const imgfile = document.getElementById("imgfile");
    const addImageBtn = document.getElementById("addImage");

    addImageBtn.addEventListener("click", () => {
        const file = imgfile.files[0];
        if (!file) return;

        const img = document.createElement("img");
        img.classList.add("selectable", "image");

        img.src = URL.createObjectURL(file);

        img.draggable = false;

        img.addEventListener("dragstart", e => {
            e.preventDefault();
        });

        img.onload = () => {
            img._settings = { 
                ...defaultImageSettings,
                animation: { ...defaultAnimationSettings }
             };
            applyImageSettings(img);

            main.appendChild(img);

            centerElement(img);//中央配置

            selectElement(img);
            //スライダー同期
            resetXYSlider();

            updateOutWarning(selectedElement);//警告チェック
        };

        img.addEventListener("mousedown", (e) => {
            selectElement(img);
            startDrag(e, img);
        });
    });

    const gazousize = document.getElementById("gazousize");
    const scalesize = document.getElementById("scalesize");
    const changescale = document.getElementById("changescale");

    //スライダーで拡大縮小
    //現在の値をspanに埋め込む関数
    const setscalesize = (val) => {
        scalesize.innerText = Math.round(val * 100) + "%";
        changescale.value = val;
    }
    
    //inputイベント時に値をセット
    const setimgsize = (e) => {
        if (!selectedElement) return;
        const val = e.target.value;

        selectedElement._settings.scale = Number(e.target.value);
        
        setscalesize(e.target.value);

        applyImageSettings(selectedElement);
        updateOutWarning(selectedElement);
    }

    gazousize.addEventListener('input', setimgsize);
    syncRangeAndNumber(gazousize, changescale, setimgsize);//スライダーとnumberを両方使えるようにする
    setupSliderTooltip(gazousize, scalesize, "%");//つまみの位置にツールチップを出す
    colorRange(gazousize);//つまみ前後に色をつける

    const xspan = document.getElementById("xspan");
    const yspan = document.getElementById("yspan");
    const changex = document.getElementById("changex");
    const changey = document.getElementById("changey");

    //画像移動
    function getScale(el) {
        return el._settings?.scale ?? 1;
        const match = el.style.transform.match(/scale\(([^)]+)\)/);
        return match ? Number(match[1]) : 1;
        updateOutWarning(selectedElement);//警告チェック
    }

    //スライダーをキャンバスと合わせる
    function updateSliderRange() {
        const rect = main.getBoundingClientRect();

        //X
        x.min = -Math.round(rect.width);
        x.max = Math.round(rect.width);

        //Y
        y.min = -Math.round(rect.height);
        y.max = Math.round(rect.height);
    }

    function syncSliderFromElement(el) {
        const scale = getScale(el);
        const w = el.offsetWidth * scale;
        const h = el.offsetHeight * scale;

        const centerLeft =
            main.clientWidth / 2 - w / 2;
        const centerTop =
            main.clientHeight / 2 - h / 2;

        x.value = Math.round(parseFloat(el._settings.left));
        y.value = Math.round(parseFloat(el._settings.top));

        xspan.innerText = x.value + "px";
        yspan.innerText = y.value + "px";
        changex.value = x.value;
        changey.value = y.value;
    }

    const xrange = (e) => {
        if (!selectedElement) return;
        const val = e.target.value;
        // let left = Number(x.value);
        let left = val;

        if (snapEnabled) {
            let result = snapX(selectedElement, Number(x.value));
            left = result.value;
            selectedElement._settings.left = result.value + "px";

            selectedElement.classList.toggle(
                "snap-active",
                result.snapped
            );
        }

        selectedElement._settings.left = left + "px";
        xspan.innerText = val + "px";
        changex.value = val;
        applyImageSettings(selectedElement);
    }

    const yrange = (e) => {
        if (!selectedElement) return;
        const val = e.target.value;
        // let top = Number(y.value);
        let top = val;

        if (snapEnabled) {
            let result = snapY(selectedElement, Number(y.value));
            top = result.value;
            selectedElement._settings.top = result.value + "px";

            selectedElement.classList.toggle(
                "snap-active",
                result.snapped
            );
        }

        selectedElement._settings.top = top + "px";
        yspan.innerText = val + "px";
        changey.value = val;
        applyImageSettings(selectedElement);
    }

    x.addEventListener('input', xrange);
    y.addEventListener('input', yrange);
    syncRangeAndNumber(x, changex, xrange);//スライダーとnumberを両方使えるようにする
    syncRangeAndNumber(y, changey, yrange);//スライダーとnumberを両方使えるようにする
    setupSliderTooltip(x, xspan, "px");//つまみの位置にツールチップを出す
    setupSliderTooltip(y, yspan, "px");//つまみの位置にツールチップを出す
    colorRange(x);//つまみ前後に色をつける
    colorRange(y);//つまみ前後に色をつける

    const animType = document.getElementById("animType");
    const animDuration = document.getElementById("animDuration");
    const animDelay = document.getElementById("animDelay");
    const animLoop = document.getElementById("animLoop");
    const getduration = document.getElementById("getduration");
    const getdelay = document.getElementById("getdelay");

    const changeduration = document.getElementById("changeduration");
    const changedelay = document.getElementById("changedelay");

    //アニメーション
    animType.addEventListener("change", () => {
        if (!selectedElement) return;
        if (!selectedElement._settings.animation) return;

        selectedElement._settings.animation.type = animType.value;
        applyAnimation(selectedElement);
    });

    const setduration = (val) => {
        getduration.innerText = val;
        changeduration.value = val;
    }

    const durationChange = (e) => {
        if (!selectedElement) return;
        const val = e.target.value;

        selectedElement._settings.animation.duration =
            Number(animDuration.value);
        
        setduration(val);
        applyAnimation(selectedElement); 
    }

    const setdelay = (val) => {
        getdelay.innerText = val;
        changedelay.value = val;
    }

    const delayChange = (e) => {
        if (!selectedElement) return;
        const val = e.target.value;

        selectedElement._settings.animation.delay =
            Number(animDelay.value);

        setdelay(val);
        applyAnimation(selectedElement);
    }

    animLoop.addEventListener("change", () => {
        if (!selectedElement) return;
        selectedElement._settings.animation.loop = animLoop.checked;

        applyAnimation(selectedElement);
    });

    syncRangeAndNumber(animDuration, changeduration, durationChange);
    syncRangeAndNumber(animDelay, changedelay, delayChange);

    setupSliderTooltip(animDuration, getduration, "秒");//つまみの位置にツールチップを出す
    setupSliderTooltip(animDelay, getdelay, "秒");//つまみの位置にツールチップを出す

    colorRange(animDuration);//つまみ前後に色をつける
    colorRange(animDelay);//つまみ前後に色をつける

    //ダウンロードするときにアニメーションを止める
    function pauseAnimation() {
        document.querySelectorAll(".text-wrapper, .image").forEach(el => {
            if (!el._settings?.animation) return;

            //animation文字列を保存
            el._savedAnimation = el.style.animation;

            //完全停止
            el.style.animation = "none";
        });
    }

    //再生させる
    function resumeAnimation() {
        document.querySelectorAll(".text-wrapper, .image").forEach(el => {
            if (!el._settings?.animation) return;

            //再生リセット
            el.style.animation = "none";
            void el.offsetWidth;

            applyAnimation(el);
        });
    }

    //GIFでダウンロードするときに再生させる
    function freezeForGif() {
        document.querySelectorAll(".text-wrapper, .image").forEach(el => {
            el._gifBackup = {
                animation: el.style.animation,
                transform: el.style.transform
            };
            el.style.animation = "none";
        });
    }

    function restoreAfterGif() {
        document.querySelectorAll(".text-wrapper, .image").forEach(el => {
            if (!el._gifBackup) return;
            el.style.animation = el._gifBackup.animation;
            el.style.transform = el._gifBackup.transform;
            delete el._gifBackup;
        });
    }

    //Gifダウンロードのときにキャンバスを操作できなくする
    function lockCanvas() {
        document.getElementById("canvasLock").hidden = false;
    }

    function unlockCanvas() {
        document.getElementById("canvasLock").hidden = true;
    }

    //設定を動かせないようにする
    function lockInputs(lock) {
        document.querySelectorAll('input[type="range"], input[type="number"], input[type="color"]')
        .forEach(el => el.disabled = lock);
    }

    function removeTransforms() {
        document.querySelectorAll(".text-wrapper, .image").forEach(el => {
            el._savedTransform = el.style.transform;
            el.style.transform = "none";
        });
    }

    function restoreTransforms() {
        document.querySelectorAll(".text-wrapper, .image").forEach(el => {
            if (el._savedTransform !== undefined) {
                el.style.transform = el._savedTransform;
            }
        });
    }

    //背景色
    const background = document.getElementById("background");
    background.addEventListener("input", (e) => {
        main.style.backgroundColor = e.target.value;
    });

    //ダウンロードボタン
    const downloadBtn = document.getElementById("download");
    const downloadgif = document.getElementById("gif");
    const transparentBg = document.getElementById("transparentBg");
    const scalehigh = document.getElementById("scalehigh");

    downloadBtn.addEventListener("click", async () => {
        //フォントの読み込みを待つ
        await document.fonts.ready;

        //警告UIを消す
        const warnings = document.querySelectorAll(".outWarning");
        warnings.forEach(el => el.style.display = "none");
        main.classList.add("exporting");//選択枠を消す

        //設定を動かせないようにする
        lockInputs(true);

        //アニメーション停止
        pauseAnimation();

        removeTransforms();

        const selectedFont = fontfamily.value;

        const originalBorder = main.style.border;
        const originalBg = main.style.backgroundColor;
        main.style.border = "none";

        const bgColor = transparentBg.checked ? null : background.value; //白背景なら #fff

        const scale = scalehigh.checked ? 2 : 1;//高解像度

        // 透過ONなら背景を消す
        if (transparentBg.checked) {
            main.style.backgroundColor = "transparent";
        }

        //mainを画像化
        //DOMをSVGに変換し、PNG生成
        const dataUrl = await htmlToImage.toPng(main,{//mainの中身を画像化
            style:{
                WebkitBackgroundClip:"text",
                WebkitTextFillColor:"transparent"
            },
            backgroundColor: transparentBg.checked ? null : background.value,
            pixelRatio: scale,
            cacheBust:true,
            fontEmbedCSS: true//フォントをSVGに埋め込み
        });

        const canvas = await html2canvas(main, {
            backgroundColor: bgColor,
            scale: scale,
            useCORS: true,
        });

        //PNGとしてダウンロード
        const link = document.createElement("a");
        link.href = canvas.toDataURL("image/png");
        link.download = "stamp.png";
        link.click();

        //警告UIを元に戻す
        warnings.forEach(el => el.style.display = "");
        main.style.backgroundColor = originalBg;
        main.style.border = originalBorder;
        main.classList.remove("exporting");

        lockInputs(false);

        restoreTransforms();

        //アニメーション再生
        resumeAnimation();
    });

    //GIFでダウンロード
    downloadgif.addEventListener("click", async () => {
        lockCanvas();

        try {
            //アニメーションを再生
            freezeForGif();

            removeTransforms();

            const scale = scalehigh.checked ? 2 : 1;

            const fps = 10;            //GIF の滑らかさ（10 fps）
            const duration = 2;        //アニメ秒数
            const totalFrames = fps * duration;
            const frames = [];

            //警告UIを消す
            document.querySelectorAll(".outWarning").forEach(el => el.style.display = "none");
            const originalBorder = main.style.border;
            main.style.border = "none";
            main.classList.add("exporting");

            //設定を動かせないようにする
            lockInputs(true);

            //各フレームを取得
            for (let i = 0; i < totalFrames; i++) {
                const progress = i / totalFrames;

                document.querySelectorAll(".text-wrapper, .image").forEach(el => {
                    if (!el._settings) return;

                    const a = el._settings.animation;

                    if (a && a.type !== "none") {
                        const ms = progress * a.duration * 1000;
                        // el.style.animation = "none";
                        void el.offsetWidth;
                        el.style.animation = `${a.type} ${a.duration}s linear ${a.delay}s 1`;
                        el.style.animationDelay = `-${ms}ms`;
                    }
                });

                await new Promise(r => requestAnimationFrame(() => r()));//次フレームまで待機

                document.querySelectorAll(".text-wrapper, .image").forEach(el => {
                    const style = getComputedStyle(el);
                    el.style.transform = style.transform;
                });

                const canvas = await html2canvas(main, {
                    backgroundColor: background.value,
                    scale: scale,
                    useCORS: true,

                });

                frames.push(canvas.toDataURL("image/png"));
            }

            //GIF 生成
            gifshot.createGIF({
                images: frames,
                interval: 1 / fps,
                gifWidth: main.clientWidth * scale,
                gifHeight: main.clientHeight * scale
            }, obj => {
                if (!obj.error) {
                    const link = document.createElement("a");
                    link.href = obj.image;
                    link.download = "stamp.gif";
                    link.click();
                }
            });

            document.querySelectorAll(".outWarning").forEach(el => el.style.display = "");
            main.style.border = originalBorder;
            main.classList.remove("exporting");

            lockInputs(false);

            //後処理
        } finally {
            restoreTransforms();
            restoreAfterGif();
            unlockCanvas();
            resumeAnimation();
        }
    });

    //初期反映
    window.addEventListener("DOMContentLoaded", () => {
        setscalesize(gazousize.value);
    });

    window.onload = () => {
        updateSliderRange();
        refreshAllSliders();
    }
</script>
